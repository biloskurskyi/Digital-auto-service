{% extends 'layouts/auth.html' %}
{% load i18n %}

{% block content %}
    <div class="card-body text-center">
        <h3 class="mb-4">{% trans 'Check your inbox' %} <i class="feather icon-mail auth-icon"></i></h3>
        <p class="mb-4">{% trans 'If an account exists with the email you entered, we have sent it a password reset link.' %}</p>
        <hr>
        <a href="{% url 'login' %}" class="btn btn-outline-light">{% trans 'Back to login' %}</a>
    </div>
{% endblock %}
