{% extends 'layouts/auth.html' %}
{% load i18n %}

{% block content %}
    <div class="card-body text-center">
        <h3 class="mb-4">{% trans 'Password changed' %} <i class="feather icon-check-circle auth-icon"></i></h3>
        <p class="mb-4">{% trans 'Your password has been set. You can now log in with it.' %}</p>
        <hr>
        <a href="{% url 'login' %}" class="btn btn-outline-light">{% trans 'Log in' %}</a>
    </div>
{% endblock %}
