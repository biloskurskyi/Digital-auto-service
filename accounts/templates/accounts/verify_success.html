{% extends 'layouts/auth.html' %}
{% load i18n %}

{% block content %}

        <h3 class="mb-4">{% trans 'Email confirmed' %} <i class="feather icon-mail auth-icon"></i></h3>
        <p class="mb-4">{% trans 'Your account was created successfully' %}

    </div>
{% endblock %}
