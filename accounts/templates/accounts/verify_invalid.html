{% extends 'layouts/auth.html' %}
{% load i18n %}

{% block content %}
    <div class="card-body text-center">
        <h3 class="mb-4">{% trans 'Error' %} <i class="feather icon-x auth-icon"></i></h3>
        <p class="mb-4">{% trans 'The verification link is invalid, expired, or this email is already registered!' %}</p>
        <hr>
        <a href="{% url 'register' %}" class="btn btn-outline-light">{% trans 'Sign up' %}</a>
    </div>
{% endblock %}
