{% load i18n %}
<nav class="pcoded-navbar">
    <div class="navbar-wrapper">
        <div class="navbar-brand header-logo">
            <a class="b-title" href="{% url 'dashboard' %}"><i class="feather icon-home"></i> DAS</a>
        </div>
        <div class="navbar-content scroll-div">
            <ul class="nav pcoded-inner-navbar">
                <li class="nav-item pcoded-menu-caption">
                    <label>{% trans 'Navigation' %}</label>
                </li>
                {% if nav.is_owner %}
                    <li class="nav-item pcoded-hasmenu">
                        <a href="javascript:" class="nav-link">
                            <span class="pcoded-micon"><i class="feather icon-box"></i></span>
                            <span class="pcoded-mtext">{% trans 'Managers' %}</span>
                        </a>
                        <ul class="pcoded-submenu">
                            <li><a href="{% url 'manager_new' %}">{% trans 'Create new manager' %}</a></li>
                            {% for manager in nav.managers %}
                                <li>
                                    <a href="{% url 'manager_edit' manager.pk %}">
                                        {{ manager.first_name }} {{ manager.last_name }} ({{ manager.username }})
                                    </a>
                                </li>
                            {% endfor %}
                        </ul>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
